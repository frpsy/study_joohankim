name: Build footer appearance pages
on:
  push:
    branches: [design/footer-appearance-20261102]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/footer-appearance-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public HTML and verify
        run: |
          python3 scripts/content_registry.py
          python3 scripts/build_library.py
          python3 scripts/build_compact_lectures.py
          python3 scripts/build_summaries.py
          python3 scripts/build_library.py --check
          python3 scripts/build_compact_lectures.py --check
          python3 scripts/build_summaries.py --check
          python3 scripts/validate_design_system.py
          python3 scripts/validate_site.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/test_*.cjs
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lectures/ mini-courses/ summaries/
          if ! git diff --cached --quiet; then
            git commit -m "build: move theme control to footer on every study page"
            git push origin HEAD:design/footer-appearance-20261102
          fi
