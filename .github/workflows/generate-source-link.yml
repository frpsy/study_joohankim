name: Regenerate study pages after source verification
on:
  push:
    branches:
      - content/affirmation-video-link-20261102
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/affirmation-video-link-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and check source-backed study pages
        run: |
          python3 scripts/build_library.py
          python3 scripts/build_summaries.py
          python3 scripts/build_compact_lectures.py
          python3 - <<'PY'
          from pathlib import Path
          previous="20261102-self-affirmation-v15"
          new="20261102-affirmation-video-v16"
          for path in (Path("concepts.html"),Path("study-history.html")):
              s=path.read_text(encoding="utf-8")
              assert s.count(previous)==2, path
              path.write_text(s.replace(previous,new),encoding="utf-8")
          PY
          python3 scripts/build_library.py --check
          python3 scripts/build_summaries.py --check
          python3 scripts/build_compact_lectures.py --check
          python3 scripts/validate_design_system.py
          python3 scripts/validate_site.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/test_*.cjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lectures/ mini-courses/ summaries/ concepts.html study-history.html
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate study app with verified official source URL"
            git push origin HEAD:content/affirmation-video-link-20261102
          fi
