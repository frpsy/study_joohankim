name: Regenerate reviewed key takeaway pages
on:
  push:
    branches:
      - editorial/key-takeaways-20261102
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/key-takeaways-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate all study pages and verify editorial consistency
        run: |
          python3 scripts/build_library.py
          python3 scripts/build_summaries.py
          python3 scripts/build_compact_lectures.py
          python3 - <<'PY'
          from pathlib import Path
          previous = "20261102-home-focus-v17"
          new = "20261102-key-takeaways-v18"
          for p in (Path("concepts.html"), Path("study-history.html")):
              old = p.read_text(encoding="utf-8")
              assert old.count(previous) == 2, f"unexpected pre-existing asset version: {p}"
              p.write_text(old.replace(previous, new), encoding="utf-8")
          PY
          python3 scripts/build_library.py --check
          python3 scripts/build_summaries.py --check
          python3 scripts/build_compact_lectures.py --check
          python3 scripts/validate_design_system.py
          python3 scripts/validate_site.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/test_*.cjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lectures/ mini-courses/ summaries/ concepts.html study-history.html
          if ! git diff --cached --quiet; then
            git commit -m "build: update seven lecture key takeaways in study pages"
            git push origin HEAD:editorial/key-takeaways-20261102
          fi
