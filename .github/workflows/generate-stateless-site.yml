name: Build stateless study app
on:
  push:
    branches: [cleanup/remove-learning-records-20261102]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-learning-records-20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and test public reading pages
        run: |
          python3 scripts/build_library.py
          python3 scripts/build_summaries.py
          python3 scripts/build_compact_lectures.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path("concepts.html")
          content=path.read_text(encoding="utf-8")
          assert "study-history.html" not in content, "history link must be removed before generation"
          assert "20261102-no-learning-records-v20" in content
          assert "강의 · 개념 · 미니강좌" in content
          PY
          python3 scripts/build_library.py --check
          python3 scripts/build_summaries.py --check
          python3 scripts/build_compact_lectures.py --check
          python3 scripts/validate_design_system.py
          python3 scripts/validate_site.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/test_*.cjs
      - name: Commit regenerated public pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lectures/ mini-courses/ summaries/
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate stateless study pages"
            git push origin HEAD:cleanup/remove-learning-records-20261102
          fi
