name: Verify public site has no learning records or account modules
on:
  push:
    branches: [source-check/20261102]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public deployment and deleted resource routes
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          base="https://frpsy.github.io/study_joohankim/"
          present=["","concepts.html","lectures/affirmation-20261101.html","mini-courses/affirmation-20261101.html","summaries/affirmation-20261101.html"]
          absent=["study-history.html","assets/progress.js","assets/account.js","assets/firebase.js","assets/firebase-config.js"]
          checks={}
          errors=[]
          def fetch(path):
              u=base+path+"?check=20261102-norecord"
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:return r.status,r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:return e.code,""
          for path in present:
              status,body=fetch(path)
              okay=status==200 and "20261102-no-learning-records-v20" in body
              if path in ("","concepts.html","lectures/affirmation-20261101.html"):
                  okay=okay and not any(x in body for x in ["study-history.html","assets/progress.js","assets/account.js",'id="study-progress"','id="settings-toggle"'])
              checks[path or "index.html"]={"status":status,"pass":okay}
              if not okay:errors.append(path+" stale or invalid")
          for path in absent:
              status,body=fetch(path)
              okay=status==404
              checks[path]={"status":status,"pass":okay}
              if not okay:errors.append(path+" expected 404")
          print(json.dumps({"checks":checks,"errors":errors},ensure_ascii=False,indent=2))
          if errors:raise SystemExit(1)
          PY
