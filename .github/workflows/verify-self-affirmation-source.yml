name: Verify refactored public study site
on:
  push:
    branches: [source-check/20261102]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check all public pages, source copy and removed account routes
        run: |
          python3 - <<'PY'
          import json,html,urllib.request,urllib.error
          root="https://frpsy.github.io/study_joohankim/"
          raw="https://raw.githubusercontent.com/frpsy/study_joohankim/main/data/mini_courses.json"
          version="2026.11.02.14"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 RefactorDeploymentVerifier"})
              try:
                  with urllib.request.urlopen(req,timeout=17) as f:return f.status,f.read().decode("utf-8","replace")
              except urllib.error.HTTPError as ex:return ex.code,""
          status,courses_json=get(raw)
          assert status==200,"failed to load canonical source"
          courses=json.loads(courses_json)
          pages=[("index.html",None),("concepts.html",None)]
          for vid,details in courses.items():
              for section in ["lectures","mini-courses","summaries"]:
                  pages.append((section+"/"+vid+".html",details["lead"]))
          failures=[]
          for path,lead in pages:
              status,body=get(root+path+"?v="+version)
              correct=status==200 and ("site.css?v="+version) in body and ("site.js?v="+version) in body
              if lead:correct=correct and html.escape(lead) in body
              if "lectures/affirmation-20261101.html"==path:correct=correct and "https://www.youtube.com/watch?v=oD5-nTDCKPg" in body
              if any(term in body for term in ["study-history.html","assets/account.js","assets/progress.js",'id="study-progress"']):correct=False
              if not correct:failures.append(path+": status "+str(status)+" or stale content")
          for path in ["study-history.html","assets/firebase.js","assets/account.js","assets/progress.js"]:
              status,_=get(root+path+"?v="+version)
              if status!=404:failures.append(path+": expected 404; got "+str(status))
          print(json.dumps({"verified_site":root,"version":version,"pages_checked":len(pages),"old_routes_checked":4,"lecture_count":len(courses),"errors":failures},ensure_ascii=False,indent=2))
          if failures:raise SystemExit(1)
          PY
