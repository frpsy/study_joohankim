name: Verify deployed iPhone PWA and PC browser pages
on:
  push:
    branches: [source-check/20261102]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public PWA, dark-mode assets, all reading pages and removed account routes
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,html
          root="https://frpsy.github.io/study_joohankim/"
          version="2026.11.02.16"
          errors=[]
          def fetch(path):
              url=root+path
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 StudyAppVerification"})
              try:
                  with urllib.request.urlopen(request,timeout=18) as response:
                      return response.status,response.read().decode("utf-8","replace")
              except urllib.error.HTTPError as error:
                  return error.code,""
          status,raw=fetch("data/mini_courses.json")
          assert status==200,"Failed to access reading source"
          courses=json.loads(raw)
          pages=["index.html","concepts.html"]
          for lecture_id in courses:
              pages.extend(folder+"/"+lecture_id+".html" for folder in ["lectures","mini-courses","summaries"])
          for p in pages:
              status,body=fetch(p+"?published="+version)
              ok=status==200 and "site.css?v="+version in body and "site.js?v="+version in body
              ok=ok and "assets/theme.js?v="+version in body and 'rel="manifest"' in body and "data-theme-toggle" in body
              if p.startswith(("lectures/","mini-courses/","summaries/")):
                  lead=courses[p.split("/")[1].split(".html")[0]]["lead"]
                  ok=ok and html.escape(lead) in body
              if not ok:errors.append("Page missing latest app shell or takeaway: "+p+" HTTP "+str(status))
          status,manifest_text=fetch("manifest.webmanifest?published="+version)
          if status!=200:errors.append("PWA manifest missing")
          else:
              manifest=json.loads(manifest_text)
              for k,val in {"id":"/study_joohankim/","scope":"./","display":"standalone","start_url":"./index.html"}.items():
                  if manifest.get(k)!=val:errors.append("Manifest invalid: "+k)
          for p in ["assets/theme.js","assets/site.css","assets/icon-512.png","assets/apple-touch-icon.png","offline.html"]:
              status,body=fetch(p+"?published="+version)
              if status!=200:errors.append("PWA resource missing: "+p)
              if p=="assets/theme.js" and "prefers-color-scheme: dark" not in body:errors.append("Theme logic missing")
              if p=="assets/site.css" and ':root[data-theme="dark"]' not in body:errors.append("Dark CSS missing")
          for p in ["study-history.html","assets/account.js","assets/progress.js","assets/firebase.js"]:
              status,_=fetch(p+"?published="+version)
              if status!=404:errors.append("Removed user data route should be 404: "+p+" status "+str(status))
          report={"site":root,"version":version,"pages":len(pages),"lectures":len(courses),"errors":errors}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errors:raise SystemExit(1)
          PY
