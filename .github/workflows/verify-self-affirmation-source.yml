name: Verify original lecture video and deployed study pages
on:
  push:
    branches:
      - source-check/20261102
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-check/20261102
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official channel video metadata and public Pages
        shell: bash
        run: |
          python3 -m pip install --quiet yt-dlp
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, json, re, subprocess, datetime, pathlib
          title_fragment="내가 나에게 하는 말이 나를 살린다"
          channel_id="UCYNnQhFGE-EP0HrWRxMGUaw"
          result={"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"channel_id":channel_id,"video_id":None,"video_url":None,"video_title":None,"source":None,"errors":[],"public_pages":{}}
          def match(title):
              return title_fragment in title or ("부두 데스" in title and "자기확언" in title)
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; StudyArchiveVerifier/1.0)"})
              with urllib.request.urlopen(req,timeout=17) as res:return res.status,res.read(900000).decode("utf-8","replace")
          rss="https://www.youtube.com/feeds/videos.xml?channel_id="+channel_id
          try:
              status,xml=get(rss)
              root=ET.fromstring(xml)
              ns={"atom":"http://www.w3.org/2005/Atom","yt":"http://www.youtube.com/xml/schemas/2015"}
              for item in root.findall("atom:entry",ns):
                  title=item.findtext("atom:title","",ns)
                  vid=item.findtext("yt:videoId","",ns)
                  if match(title) and re.fullmatch(r"[A-Za-z0-9_-]{11}",vid):
                      result.update(video_id=vid,video_url="https://www.youtube.com/watch?v="+vid,video_title=title,source="official_youtube_rss")
                      break
              if result["video_id"] is None:result["errors"].append("RSS returned no title match")
          except Exception as ex:result["errors"].append("RSS: "+str(ex)[:250])
          if result["video_id"] is None:
              for tab in ("streams","videos"):
                  try:
                      cmd=["yt-dlp","--no-warnings","--skip-download","--flat-playlist","--playlist-end","9","--dump-single-json","https://www.youtube.com/@joohankim/"+tab]
                      cp=subprocess.run(cmd,capture_output=True,text=True,timeout=90)
                      if cp.returncode!=0:
                          result["errors"].append("yt-dlp "+tab+": "+cp.stderr[-350:].strip())
                          continue
                      data=json.loads(cp.stdout)
                      for entry in data.get("entries",[]):
                          title=entry.get("title") or ""
                          vid=entry.get("id") or ""
                          if match(title) and re.fullmatch(r"[A-Za-z0-9_-]{11}",vid):
                              result.update(video_id=vid,video_url="https://www.youtube.com/watch?v="+vid,video_title=title,source="yt_dlp_official_channel_"+tab)
                              break
                      if result["video_id"]:break
                  except Exception as ex:result["errors"].append("yt-dlp "+tab+": "+str(ex)[:250])
          urls=[
            "https://frpsy.github.io/study_joohankim/",
            "https://frpsy.github.io/study_joohankim/lectures/affirmation-20261101.html",
            "https://frpsy.github.io/study_joohankim/mini-courses/affirmation-20261101.html",
            "https://frpsy.github.io/study_joohankim/summaries/affirmation-20261101.html",
          ]
          for u in urls:
              try:
                  status,body=get(u+"?refresh=2026.11.02.8")
                  result["public_pages"][u]={"status":status,"contains_lecture_title":title_fragment in body,"contains_new_version":"20261102-self-affirmation-v15" in body,"content_length":len(body)}
              except Exception as ex:result["public_pages"][u]={"error":str(ex)[:250]}
          path=pathlib.Path("docs/source-check-20261102.json")
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Commit verification evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source-check-20261102.json
          git commit -m "docs: record live study pages and official video metadata check"
          git push origin HEAD:source-check/20261102
