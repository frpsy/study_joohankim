name: Verify all seven published key takeaways
on:
  push:
    branches:
      - source-check/20261102
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-check/20261102
      - name: Check all public study pages against current canonical leads
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, html, json, pathlib, time, urllib.request
          base="https://frpsy.github.io/study_joohankim/"
          raw="https://raw.githubusercontent.com/frpsy/study_joohankim/main/data/mini_courses.json"
          version="20261102-key-takeaways-v18"
          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 StudyArchiveQualityCheck"})
              with urllib.request.urlopen(req,timeout=17) as response:
                  return response.status,response.read().decode("utf-8","replace")
          status,raw_json=fetch(raw)
          assert status==200
          leads=json.loads(raw_json)
          result={"verified_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"main_version":"2026.11.02.11","checked_pages":{},"issues":[]}
          urls=[("home",base,None)]
          for vid,row in leads.items():
              for folder in ("lectures","mini-courses","summaries"):
                  urls.append((folder+"/"+vid,base+folder+"/"+vid+".html",row["lead"]))
          for name,url,lead in urls:
              try:
                  # Unique cache-busting query avoids stale CDN responses.
                  status,text=fetch(url+"?refresh=2026.11.02.11")
                  checks={"http_200":status==200,"new_asset_version":version in text}
                  if lead is not None:checks["reviewed_takeaway_visible"]=html.escape(lead) in text
                  result["checked_pages"][name]=checks
                  if not all(checks.values()):result["issues"].append(name+": "+str(checks))
              except Exception as e:
                  result["checked_pages"][name]={"error":str(e)[:220]}
                  result["issues"].append(name+": "+str(e)[:220])
          out=pathlib.Path("docs/key-takeaway-public-check-20261102.json")
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"number_of_pages":len(urls),"issues":result["issues"],"all_passed":not result["issues"]},ensure_ascii=False))
          if result["issues"]:raise SystemExit(1)
          PY
      - name: Commit verification evidence to isolated audit branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/key-takeaway-public-check-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: verify public key takeaways on all 22 study pages"
            git push origin HEAD:source-check/20261102
          fi
