<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="학습 완료와 복습 완료 기록을 최근순으로 보는 페이지"><title>내면의 서재 · 학습 이력</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="assets/site.css?v=20261102-self-affirmation-v15"><script defer src="assets/site.js?v=20261102-self-affirmation-v15"></script></head><body><a class="skip-link" href="#main">본문으로 건너뛰기</a><header class="site-header"><div class="site-header-inner"><a class="site-brand" href="index.html"><img class="brand-symbol" src="assets/icon.svg" width="32" height="32" alt="" aria-hidden="true"><span class="brand-name">내면의 서재<small>강의 · 개념 · 복습</small></span></a><nav class="global-nav" aria-label="주요 메뉴"><a href="index.html">자료 모음</a><a href="concepts.html">용어와 개념</a><a href="study-history.html" aria-current="page">학습 이력</a></nav></div></header><div class="site-shell"><main id="main" class="study-main"><div class="page-hero"><span class="eyebrow">내 기록</span><h1>학습 이력</h1><p>학습·복습 완료 기록을 최근순으로 확인할 수 있습니다.</p></div><section id="history-list" class="lecture-section"><div id="history-status" role="status" aria-live="polite"></div><ol id="history-items" class="history-items"></ol></section></main></div><footer class="site-footer"><div class="site-footer-inner"><span>내면의 서재 · 학습 기록</span><a href="index.html">자료 모음으로</a><a href="concepts.html">용어와 개념</a></div></footer>
<script type="module">
import { getDb, onUserChange } from "./assets/firebase.js?v=20261031-review";

const status = document.getElementById("history-status");
const list = document.getElementById("history-items");
const KIND = { study: "학습 완료", review: "복습 완료" };

function say(msg, isError = false) {
  status.textContent = msg;
  status.dataset.state = isError ? "error" : "ok";
}

async function loadTitles() {
  try {
    const res = await fetch("lectures.json");
    const items = await res.json();
    return Object.fromEntries(items.map((x) => [x.id, x.title]));
  } catch {
    return {};
  }
}

function fmt(ts) {
  const d = ts && typeof ts.toDate === "function" ? ts.toDate() : null;
  return d ? d.toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }) : "저장 중";
}

function describe(entry, titles) {
  const kind = KIND[entry.kind];
  const action = entry.value ? "표시" : "해제";
  return { title: titles[entry.lectureId] || entry.lectureId, text: `${kind} ${action}`, href: `lectures/${entry.lectureId}.html` };
}

let generation = 0;

async function load(user, token) {
  const current = () => token === generation;
  say("불러오는 중");
  try {
    const { db, fs } = await getDb();
    const q = fs.query(fs.collection(db, "studyUsers", user.uid, "history"), fs.orderBy("at", "desc"), fs.limit(100));
    const [snap, titles] = await Promise.all([fs.getDocs(q), loadTitles()]);
    if (!current()) return;
    list.replaceChildren();
    const visible = snap.docs.map(doc => doc.data()).filter(entry => Object.prototype.hasOwnProperty.call(KIND,entry.kind));
    if (!visible.length) {
      say("아직 학습·복습 기록 없음");
      return;
    }
    for (const entry of visible) {
      const info = describe(entry, titles);
      const li = document.createElement("li");
      li.className = "history-item";
      const when = document.createElement("span");
      when.className = "history-when";
      when.textContent = fmt(entry.at);
      const a = document.createElement("a");
      a.href = info.href;
      a.textContent = info.title;
      const what = document.createElement("span");
      what.textContent = info.text;
      li.append(when, document.createElement("br"), a, document.createElement("br"), what);
      list.append(li);
    }
    say(`최근 ${visible.length}건`);
  } catch (err) {
    if (!current()) return;
    say("학습 이력을 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.", true);
  }
}

function renderSignedOut() {
  list.replaceChildren();
  say("학습 기록을 보려면 로그인해 주세요.");
  if (!document.getElementById("history-home")) {
    const a = document.createElement("a");
    a.id = "history-home";
    a.className = "btn";
    a.href = "index.html#settings";
    a.textContent = "홈에서 로그인하기";
    status.after(a);
  }
}

Promise.resolve(onUserChange((user) => {
  const token = ++generation;
  list.replaceChildren();
  const home = document.getElementById("history-home");
  if (user) {
    if (home) home.remove();
    load(user, token);
  } else {
    renderSignedOut();
  }
})).catch(() => say("로그인 상태 확인 실패 · 네트워크 연결을 확인해 주세요.", true));
</script></body></html>
