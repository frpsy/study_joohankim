<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="내가 표시한 학습 완료, 복습 완료, 메모의 이력을 최근순으로 보는 페이지"><title>학습 이력 · 내면을 공부하는 시간</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="assets/site.css?v=20261031-review"><script defer src="assets/site.js?v=20261030-layout"></script></head><body><a class="skip-link" href="#main">본문으로 건너뛰기</a><header class="site-header"><div class="site-header-inner"><a class="site-brand" href="index.html">내면을 공부하는 시간<small>강의 학습 아카이브</small></a><nav class="global-nav" aria-label="주요 메뉴"><a href="index.html">강의 모음</a><a href="concepts.html">용어와 개념</a><a href="study-history.html" aria-current="page">학습 이력</a></nav></div></header><div class="site-shell"><main id="main" class="study-main"><div class="page-hero"><span class="eyebrow">내 기록</span><h1>학습 이력</h1><p>학습 완료, 복습 완료, 메모를 바꾼 기록을 최근순으로 보여 줍니다. 기록은 로그인한 계정에만 보입니다.</p></div><section id="history-list" class="lecture-section"><div id="history-status" role="status" aria-live="polite"></div><ol id="history-items" class="history-items"></ol></section></main></div>
<script type="module">
import { getDb, onUserChange } from "./assets/firebase.js?v=20261031-review";

const status = document.getElementById("history-status");
const list = document.getElementById("history-items");
const KIND = { study: "학습 완료", review: "복습 완료", note: "메모" };

function say(msg, isError = false) {
  status.textContent = msg;
  status.dataset.state = isError ? "error" : "ok";
}

async function loadTitles() {
  try {
    const res = await fetch("lectures.json");
    const items = await res.json();
    return Object.fromEntries(items.map((x) => [x.id, x.title]));
  } catch {
    return {};
  }
}

function fmt(ts) {
  const d = ts && typeof ts.toDate === "function" ? ts.toDate() : null;
  return d ? d.toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }) : "저장 중";
}

function describe(entry, titles) {
  const kind = KIND[entry.kind] || "기록";
  let action;
  if (entry.kind === "note") action = entry.value ? "메모를 작성했습니다" : "메모를 비웠습니다";
  else action = entry.value ? "표시했습니다" : "해제했습니다";
  return { title: titles[entry.lectureId] || entry.lectureId, text: `${kind} ${action}`, href: `lectures/${entry.lectureId}.html` };
}

async function load(user) {
  say("이력을 불러오는 중입니다.");
  try {
    const { db, fs } = await getDb();
    const q = fs.query(fs.collection(db, "studyUsers", user.uid, "history"), fs.orderBy("at", "desc"), fs.limit(100));
    const [snap, titles] = await Promise.all([fs.getDocs(q), loadTitles()]);
    list.replaceChildren();
    if (snap.empty) {
      say("아직 기록이 없습니다. 강의 페이지에서 학습 완료나 메모를 저장하면 여기에 나타납니다.");
      return;
    }
    for (const doc of snap.docs) {
      const entry = doc.data();
      const info = describe(entry, titles);
      const li = document.createElement("li");
      li.className = "history-item";
      const when = document.createElement("span");
      when.className = "history-when";
      when.textContent = fmt(entry.at);
      const a = document.createElement("a");
      a.href = info.href;
      a.textContent = info.title;
      const what = document.createElement("span");
      what.textContent = info.text;
      li.append(when, document.createElement("br"), a, document.createElement("br"), what);
      list.append(li);
    }
    say(`최근 ${snap.size}건을 보여 줍니다.`);
  } catch (err) {
    say("이력을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.", true);
  }
}

function renderSignedOut() {
  list.replaceChildren();
  say("이력을 보려면 홈 화면의 설정에서 구글로 로그인해 주세요.");
  if (!document.getElementById("history-home")) {
    const a = document.createElement("a");
    a.id = "history-home";
    a.className = "btn";
    a.href = "index.html#settings";
    a.textContent = "홈에서 로그인하기";
    status.after(a);
  }
}

onUserChange((user) => {
  const home = document.getElementById("history-home");
  if (user) {
    if (home) home.remove();
    load(user);
  } else {
    renderSignedOut();
  }
});
</script></body></html>
